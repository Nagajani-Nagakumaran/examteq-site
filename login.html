<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Login to your ExamTeq member account and access topic tests and videos." />
  <title>Login | ExamTeq</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .form-section { max-width: 520px; margin: 0 auto; padding: 2rem 1rem; }
    .cta-button { background:#0b1e44; color:#fff; border:none; padding:.7rem 1rem; border-radius:10px; font-weight:700; cursor:pointer; }
    .muted{opacity:.85}
  </style>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://kblzukxjorgdebwrwgzb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibHp1a3hqb3JnZGVid3J3Z3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg0NDk0NzEsImV4cCI6MjA3NDAyNTQ3MX0.wZGDtJCIzSEJREkqeIkoAvCN81XeMFOmEJ3LrJaaLi8";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.login = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');
      const okDiv = document.getElementById('ok');
      errorDiv.textContent = ""; okDiv.textContent = "";

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorDiv.textContent = "Login failed: " + error.message;
        return;
      }

      // Require verified email
      const user = data?.user;
      if (!user?.email_confirmed_at) {
        errorDiv.innerHTML = `
          Please verify your email before logging in.
          <br/><button id="resend" class="cta-button" style="margin-top:.5rem;background:#6b7280;">Resend verification email</button>
        `;
        document.getElementById("resend")?.addEventListener("click", async () => {
          const { error: re } = await supabase.auth.resend({ type: "signup", email });
          if (re) errorDiv.textContent = re.message;
          else okDiv.textContent = "Verification email sent. Please check your inbox (and spam).";
        });
        return;
      }

      // Success → dashboard
      window.location.href = "/members.html";
    };

    // Optional: send reset password email
    window.resetPassword = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('ok');
      const err = document.getElementById('error');
      if (!email) { err.textContent = "Enter your email above first."; return; }
      err.textContent = ""; msg.textContent = "Sending reset link…";
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: "https://examteq.com/login.html"
      });
      if (error) err.textContent = error.message;
      else msg.textContent = "Password reset email sent.";
    };
  </script>
</head>
<body>
  <header></header>

  <main class="form-section">
    <h1>Member Login</h1>
    <p class="muted">Access your exclusive resources and topic tests.</p>

    <form onsubmit="login(event)">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password" style="margin-top:.5rem;">Password</label>
      <input type="password" id="password" required />

      <div id="error" style="color:#b91c1c; font-size:.95rem; margin:.5rem 0;"></div>
      <div id="ok" style="color:#047857; font-size:.95rem; margin:.5rem 0;"></div>

      <button type="submit" class="cta-button">Login</button>
      <button onclick="resetPassword(event)" class="cta-button" type="button" style="background:#6b7280;margin-left:.5rem;">Forgot password</button>
    </form>

    <p style="margin-top:1rem; text-align:center;">
      New to ExamTeq? <a href="/signup.html">Create an Account</a>
    </p>
  </main>

  <footer></footer>
</body>
</html>
